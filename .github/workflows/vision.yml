name: Publish vision image
on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_tag:
        description: Successfully published compiled image commit
        required: true
        default: 35f65fb133bb9ae412155c1ebeaf7ba0401fe2b9
permissions:
  contents: read
  packages: write
jobs:
  vision:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_TAG: ${{ github.event.workflow_run.head_sha || inputs.base_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package updated vision entrypoint
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_TAG" =~ ^[0-9a-f]{40}$ ]]
          printf 'FROM ghcr.io/pandanyxis/runpod-qwen:%s\nCOPY entrypoint.sh /usr/local/bin/start-qwen\nRUN chmod +x /usr/local/bin/start-qwen\n' "$BASE_TAG" > Dockerfile.vision
          docker build -f Dockerfile.vision -t ghcr.io/pandanyxis/runpod-qwen:vision -t ghcr.io/pandanyxis/runpod-qwen:vision-${{ github.sha }} .
      - name: Check shell syntax
        run: docker run --rm --entrypoint /bin/bash ghcr.io/pandanyxis/runpod-qwen:vision -n /usr/local/bin/start-qwen
      - name: Publish
        run: |
          docker push ghcr.io/pandanyxis/runpod-qwen:vision-${{ github.sha }}
          docker push ghcr.io/pandanyxis/runpod-qwen:vision
