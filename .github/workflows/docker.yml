name: Build and publish Docker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .dockerignore, .github/workflows/docker.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: >-
          docker build --build-arg BUILD_JOBS=2 --build-arg CUDA_ARCHITECTURES=86
          --label org.opencontainers.image.source=https://github.com/pandanyxis/runpod-qwen
          -t ghcr.io/pandanyxis/runpod-qwen:latest
          -t ghcr.io/pandanyxis/runpod-qwen:${{ github.sha }} .
      - name: Check runtime libraries
        run: docker run --rm --entrypoint /bin/bash ghcr.io/pandanyxis/runpod-qwen:latest -c '! ldd /opt/llama/bin/llama-server | grep "not found"'
      - name: Push image
        run: |
          docker push ghcr.io/pandanyxis/runpod-qwen:${{ github.sha }}
          docker push ghcr.io/pandanyxis/runpod-qwen:latest
